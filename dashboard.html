<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniSignal Telegram 推送设置</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>

<body>
  <main class="panel">
    <header>
      <div>
        <p class="eyebrow">UNISIGNAL</p>
        <h1>Telegram 推送设置</h1>
      </div>
      <div id="status" class="status disconnected">
        <span class="status-dot"></span>
        <span id="statusText">未连接</span>
      </div>
    </header>

    <form id="connectionForm" class="connection-form">
      <label for="accessToken">Access Token</label>
      <div class="input-row">
        <input id="accessToken" name="accessToken" type="password" placeholder="请输入 Access Token" autocomplete="off"
          spellcheck="false" required />
        <button type="submit">保存并连接</button>
      </div>
      <p id="connectionDetail" class="detail"></p>
    </form>

    <div class="actions">
      <a href="https://t.me/unisignal_relay_bot?start=token" target="_blank" rel="noopener noreferrer">获取 Access Token</a>
      <button id="reconnect" class="secondary" type="button">重新连接</button>
      <a href="https://gmgn.ai/" target="_blank" rel="noopener noreferrer">打开 GMGN</a>
    </div>

    <p class="hint">连接成功后即可关闭此页面。Telegram 推送将按时间顺序显示在 GMGN 推特监控中。</p>
  </main>

  <script src="dashboard.js"></script>
</body>

</html>
