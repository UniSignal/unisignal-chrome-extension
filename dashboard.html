<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniSignal Telegram Feed</title>
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <main class="panel">
      <header>
        <div>
          <p class="eyebrow">UNISIGNAL</p>
          <h1>Telegram Feed</h1>
        </div>
        <div id="status" class="status disconnected">
          <span class="status-dot"></span>
          <span id="statusText">未连接</span>
        </div>
      </header>

      <form id="connectionForm" class="connection-form">
        <label for="accessToken">Access Token</label>
        <div class="input-row">
          <input
            id="accessToken"
            name="accessToken"
            type="password"
            placeholder="输入 access token"
            autocomplete="off"
            spellcheck="false"
            required
          />
          <button type="submit">保存并连接</button>
        </div>
        <p id="connectionDetail" class="detail"></p>
      </form>

      <div class="actions">
        <button id="reconnect" class="secondary" type="button">立即重连</button>
        <a href="https://gmgn.ai/" target="_blank" rel="noopener noreferrer">打开 GMGN</a>
      </div>

      <p class="hint">Telegram 推送会显示在 GMGN 信息流顶部，设置页可以关闭。</p>
    </main>

    <script src="dashboard.js"></script>
  </body>
</html>
