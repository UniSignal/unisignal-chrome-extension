<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniSignal Telegram 推送设置</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>

<body>
  <main class="panel">
    <header>
      <div>
        <p class="eyebrow">UNISIGNAL</p>
        <h1>Telegram 推送设置</h1>
      </div>
      <div id="status" class="status disconnected">
        <span class="status-dot"></span>
        <span id="statusText">未连接</span>
      </div>
    </header>

    <form id="connectionForm" class="connection-form">
      <label for="accessToken">Access Token</label>
      <div class="input-row">
        <input id="accessToken" name="accessToken" type="password" placeholder="请输入 Access Token" autocomplete="off"
          spellcheck="false" required />
        <button type="submit">保存并连接</button>
      </div>
      <p id="connectionDetail" class="detail"></p>
    </form>

    <section class="preferences" aria-labelledby="channelsTitle">
      <h2 id="channelsTitle">频道配置</h2>
      <label class="preference" for="primaryChannel">
        <span>聚合监控</span>
        <input id="primaryChannel" type="checkbox" checked disabled />
      </label>
      <label class="preference" for="secondaryChannelEnabled">
        <span>Unisignal Feed</span>
        <input id="secondaryChannelEnabled" type="checkbox" />
      </label>
    </section>

    <section class="preferences" aria-labelledby="preferencesTitle">
      <h2 id="preferencesTitle">显示与声音</h2>
      <label class="preference" for="soundEnabled">
        <span>新消息通知声音</span>
        <input id="soundEnabled" type="checkbox" checked />
      </label>
      <label class="preference range-preference" for="notificationVolume">
        <span>通知声音大小</span>
        <span class="range-control">
          <input id="notificationVolume" type="range" min="0" max="100" step="1" value="50" />
          <output id="notificationVolumeValue" for="notificationVolume">50%</output>
        </span>
      </label>
      <label class="preference range-preference" for="messageFontSize">
        <span>消息字体大小</span>
        <span class="range-control">
          <input id="messageFontSize" type="range" min="12" max="20" step="1" value="15" />
          <output id="messageFontSizeValue" for="messageFontSize">15px</output>
        </span>
      </label>
    </section>

    <div class="settings-actions">
      <button id="saveSettings" type="button">保存设置</button>
    </div>
    <p id="settingsDetail" class="detail"></p>

    <div class="actions">
      <a href="https://t.me/unisignal_relay_bot?start=token" target="_blank" rel="noopener noreferrer">获取 Access Token</a>
      <button id="reconnect" class="secondary" type="button">重新连接</button>
      <a href="https://gmgn.ai/" target="_blank" rel="noopener noreferrer">打开 GMGN</a>
    </div>

    <p class="hint">连接成功后即可关闭此页面。Telegram 推送将按时间顺序显示在 GMGN 推特监控中。</p>
  </main>

  <script src="dashboard.js"></script>
</body>

</html>
