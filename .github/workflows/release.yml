name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true
        type: string
      release_name:
        description: Optional release title
        required: false
        type: string
      notes:
        description: Release notes
        required: false
        type: string
      upload_archive:
        description: Upload the Chrome extension ZIP
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release-${{ inputs.tag || github.ref_name }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_NAME: ${{ inputs.release_name }}
      RELEASE_NOTES: ${{ inputs.notes }}
      UPLOAD_ARCHIVE: ${{ github.event_name == 'push' || inputs.upload_archive }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Check source and run unit tests
        run: |
          npm run check
          npm test

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Run browser regression tests
        run: npm run test:browser

      - name: Package extension
        if: env.UPLOAD_ARCHIVE == 'true'
        shell: bash
        run: |
          archive="unisignal-chrome-extension-${RELEASE_TAG}.zip"
          files=(
            content-script.js
            dashboard.css
            dashboard.html
            dashboard.js
            floating-bridge.js
            gmgn-bridge.js
            icons
            manifest.json
            service-worker.js
          )

          if [[ -f notification-sound.mp3 ]]; then
            files+=(notification-sound.mp3)
          fi

          zip -r "$archive" "${files[@]}"

      - name: Create or update release
        shell: bash
        run: |
          archive="unisignal-chrome-extension-${RELEASE_TAG}.zip"
          args=()
          if [[ -n "$RELEASE_NAME" ]]; then
            args+=(--title "$RELEASE_NAME")
          fi
          if [[ -n "$RELEASE_NOTES" ]]; then
            printf '%s' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"
            args+=(--notes-file "$RUNNER_TEMP/release-notes.md")
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json id >/dev/null; then
            if [[ "$UPLOAD_ARCHIVE" == true ]]; then
              gh release upload "$RELEASE_TAG" "$archive" --repo "$GITHUB_REPOSITORY" --clobber
            fi
            if (( ${#args[@]} )); then
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${args[@]}"
            fi
            exit 0
          fi

          if [[ -z "$RELEASE_NOTES" ]]; then
            args+=(--generate-notes)
          fi
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          if [[ "$UPLOAD_ARCHIVE" == true ]]; then
            args+=("$archive")
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag "${args[@]}"
